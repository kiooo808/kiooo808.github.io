name: Recover stale Pages deployment
on:
  workflow_dispatch:
permissions:
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const target = 'b5f3ba069e0a8a1f89656438de55917baefd2947';
            const args = { ...context.repo, pages_deployment_id: target };
            const before = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', args);
            core.info(`Stale deployment ${target}: ${before.data.status}`);
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', args);
            const after = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', args);
            core.info(`Recovery status: ${after.data.status}`);
