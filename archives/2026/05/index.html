  document.addEventListener('DOMContentLoaded', () => {
    const span = document.getElementById('runtime_span');
    if (!span) return;
    const startedAt = new Date('2026-04-01T00:00:00+08:00').getTime();
    function updateRuntime() {
      const total = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
      const days = Math.floor(total / 86400);
      const hours = Math.floor(total / 3600) % 24;
      const minutes = Math.floor(total / 60) % 60;
      const seconds = total % 60;
      span.textContent = `本站已运行 ${days} 天 ${hours} 小时 ${minutes} 分 ${seconds} 秒`;
    }
    updateRuntime();
    window.setInterval(updateRuntime, 1000);
  }, { once: true });
